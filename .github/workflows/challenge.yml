name: Challenge (bonus)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bonus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rsync if missing
        run: |
          set -e
          if ! command -v rsync >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq rsync
          fi

      - name: Build fixtures and recompute
        run: |
          bash init.sh
          bash check.sh

      - name: Bonus tally
        run: python3 tools/ci_bonus.py

      - uses: actions/upload-artifact@v4
        with:
          name: challenge_report
          path: results/challenge_report.json
